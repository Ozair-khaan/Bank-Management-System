spring.application.name=Bank-Management-System
server.port=8080
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
# MySQL Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/bank_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sql@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA/Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Logging Configuration
# Set the root logging level
logging.level.root=INFO
# Show DEBUG logs specifically for our bank code
logging.level.com.bank=DEBUG
# Write logs to a file
logging.file.name=logs/bank-application.log
# Keep up to 10MB per file, then roll it over
logging.logback.rollingpolicy.max-file-size=10MB
# Keep 7 days of logs history
logging.logback.rollingpolicy.max-history=7
springdoc.paths-to-match=/api/**

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/bank-realm